{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{% static 'home.css' %}">
    <title>Document</title>
</head>
<body>
    {% include 'navbar.html' %}
<h1>All tasks</h1>
<table>
    <tr>
        <th>Title</th>
        <th>Discription</th>
        <th>Done</th>
        <th>Created</th>
        <th>Actions</th>
    </tr>
    {% for task in tasks %}
    <tr>
        <td>{{ task.title }}</td>
        <td>{{ task.description }}</td>
        <td>
            <form action="{% url 'toggle_task' task.id %}" method="POST">
                {% csrf_token %}
                <input type="checkbox" {% if task.completed %}checked{% endif %} onchange="this.form.submit()">
            </form>
        </td>
        <td>{{ task.created }}</td>
        <td>
          <a href="{% url 'edit_task' task.id %}"><button class="edit">Edit</button></a>
          <a href="{% url 'delete' task.id %}"><button class="delete">Delete</button></a>
        </td>
    </tr>
    {% empty %}
    <tr>
        <td colspan="5">No tasks yet.</td>
    </tr>
    {% endfor %}
</table>
</body>
</html>
