{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link rel="stylesheet" href="{% static 'edit_task.css' %}">
</head>
<body>
  {% include 'navbar.html' %}
  <h1>Edit Task</h1>
  <form action="{% url 'edit_task_form' task_data.id %}" method="POST">
      {% csrf_token %}
      <label for="title">Title</label>
      <input type="text" name="title" placeholder="New Title of the task">
      <label for="description">Description</label>
      <input type="text" name="description" placeholder="New description of the task">
      <div class="button-row">
        <button class="save" type="submit">Save</button>
        <a href="{% url 'home' %}"><button class="Cancel">Cancel</button></a>
      </div>
  </form>
</body>
</html>
